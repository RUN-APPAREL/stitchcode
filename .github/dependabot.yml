# ------------------------------------------------------------------
# Dependabot — keeps the parts fresh and safe, automatically.
# Small updates are grouped so the pull-request inbox stays tidy.
# ------------------------------------------------------------------
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, docker]
