# ------------------------------------------------------------------
# Release — tag a version (e.g. v1.2.3) and the robot:
#   1. builds the studio,
#   2. zips it (a "download & open" bundle for non-coders),
#   3. publishes a GitHub Release with the zip attached.
# ------------------------------------------------------------------
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # Relative base so the zip works from any folder or web host.
      - name: Build (portable)
        run: npm run build -- --base=./

      - name: Zip the site
        run: |
          cd dist
          zip -r ../stitchcode-${{ github.ref_name }}.zip .

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: stitchcode-${{ github.ref_name }}.zip
