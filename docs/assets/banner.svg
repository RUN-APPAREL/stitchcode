<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="RUN STITCHCODE — QR code studio">
  <!-- canvas -->
  <rect width="1280" height="420" fill="#1C1C1A"/>
  <!-- faint module field -->
  <g fill="#F0EEDF" opacity="0.05">
    <rect x="700" y="40" width="18" height="18"/><rect x="760" y="80" width="18" height="18"/>
    <rect x="820" y="40" width="18" height="18"/><rect x="1180" y="60" width="18" height="18"/>
    <rect x="1220" y="120" width="18" height="18"/><rect x="1140" y="320" width="18" height="18"/>
    <rect x="1200" y="360" width="18" height="18"/><rect x="660" y="350" width="18" height="18"/>
    <rect x="720" y="310" width="18" height="18"/><rect x="1080" y="40" width="18" height="18"/>
  </g>
  <!-- theme confetti squares -->
  <rect x="1216" y="236" width="22" height="22" fill="#16336F"/>
  <rect x="1216" y="266" width="22" height="22" fill="#DBE64C"/>
  <rect x="1186" y="266" width="22" height="22" fill="#FE492A"/>

  <!-- the stitch mark -->
  <g>
    <rect x="84" y="110" width="232" height="232" rx="26" fill="#F0EEDF" opacity="0.12" transform="translate(10 10)"/>
    <rect x="84" y="110" width="232" height="232" rx="26" fill="#26261f" stroke="#F0EEDF" stroke-width="3"/>
    <!-- finder squares -->
    <g fill="#F0EEDF">
      <path d="M116 142h62v62h-62zm14 14v34h34v-34z"/>
      <path d="M222 142h62v62h-62zm14 14v34h34v-34z"/>
      <path d="M116 248h62v62h-62zm14 14v34h34v-34z"/>
      <!-- data modules -->
      <rect x="196" y="142" width="14" height="14"/><rect x="196" y="168" width="14" height="14"/>
      <rect x="116" y="222" width="14" height="14"/><rect x="142" y="222" width="14" height="14"/>
      <rect x="248" y="222" width="14" height="14"/><rect x="222" y="222" width="14" height="14"/>
      <rect x="196" y="294" width="14" height="14"/><rect x="248" y="294" width="14" height="14"/>
      <rect x="222" y="248" width="14" height="14"/><rect x="196" y="248" width="14" height="14"/>
      <rect x="274" y="248" width="10" height="10"/><rect x="274" y="274" width="10" height="10"/>
      <rect x="116" y="320" width="10" height="10"/><rect x="140" y="320" width="10" height="10"/>
    </g>
    <!-- vermillion bolt — the stitch itself -->
    <path fill="#FE492A" d="M234 216l-30 42h16l-9 34 33-46h-17l7-30z"/>
  </g>

  <!-- wordmark -->
  <text x="372" y="238" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="86" letter-spacing="2">
    <tspan fill="#F0EEDF">RUN </tspan><tspan fill="#FE492A">STITCH</tspan><tspan fill="#F0EEDF">CODE</tspan>
  </text>
  <!-- hard rule -->
  <rect x="376" y="262" width="210" height="6" fill="#FE492A"/>
  <rect x="596" y="262" width="34" height="6" fill="#DBE64C"/>
  <!-- tagline -->
  <text x="376" y="306" font-family="'Courier New',ui-monospace,monospace" font-size="21" letter-spacing="7" fill="#F0EEDF" opacity="0.72">
    QR CODE STUDIO · STAYS ON YOUR DEVICE
  </text>
</svg>
