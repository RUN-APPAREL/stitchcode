# RUN STITCHCODE — nginx settings for the Docker image
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The studio is a single-page app: any path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Squash text on the way out — pages travel smaller
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted assets may be cached for a year; the page itself never
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Small, sensible safety headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
